services:
  db:
    image: postgres:16-alpine
    container_name: hermex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermex}
      POSTGRES_DB: ${POSTGRES_DB:-hermex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hermex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hermex} -d $${POSTGRES_DB:-hermex}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hermex-pgdata:
